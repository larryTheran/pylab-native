name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: python -m pip install -r requirements-test.txt
      - name: Protocol and data validation
        run: ./scripts/test-python.sh
        env:
          PYLAB_KERNEL_PYTHON: python
          MPLBACKEND: Agg
          PYTHONDONTWRITEBYTECODE: '1'
      - name: Execute cells and inspect their outputs in a real Jupyter kernel
        run: ./scripts/test-bridge.sh
        env:
          PYLAB_KERNEL_PYTHON: python

  native-build:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcrun --sdk macosx --show-sdk-version
          xcrun swiftc --version
      - name: Build arm64 macOS 26 app
        run: ./scripts/build.sh
      - name: Focused model checks
        run: ./scripts/test-models.sh
      - name: Verify development signature
        run: codesign --verify --deep --strict dist/PyLabNative.app
      - name: Package the checked app
        run: ditto -c -k --sequesterRsrc --keepParent dist/PyLabNative.app dist/PyLabNative-macos-arm64.zip
      - uses: actions/upload-artifact@v7
        with:
          path: dist/PyLabNative-macos-arm64.zip
          archive: false
          if-no-files-found: error
